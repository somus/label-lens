name: Release

on:
  release:
    types: [published]

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            # Host arch matches target — no foreign optional-dep install needed.
            foreign_opentui: ""
          - target: darwin-x64
            runner: macos-14
            # Cross-compile from arm64 host. Bun ≥ 1.3.11 installs foreign-arch
            # optional deps cleanly (supersedes ADR 0006); we still need to ask
            # for the darwin-x64 OpenTUI native lib explicitly because the
            # default `bun install` only pulls the host-matching one.
            foreign_opentui: "@opentui/core-darwin-x64"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            foreign_opentui: ""
          - target: linux-x64
            runner: ubuntu-latest
            foreign_opentui: ""
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Install foreign-arch OpenTUI native lib
        if: matrix.foreign_opentui != ''
        # `--no-save --force` so package.json / bun.lock stay clean. Version
        # pinned to the resolved `@opentui/core` version so the native lib
        # always matches the JS layer.
        run: |
          version=$(bun pm ls @opentui/core --depth 0 2>/dev/null | awk '/@opentui\/core@/ { sub(/.*@opentui\/core@/, ""); print; exit }')
          if [ -z "$version" ]; then
            version=$(node -p "require('./node_modules/@opentui/core/package.json').version")
          fi
          echo "installing ${{ matrix.foreign_opentui }}@${version}"
          bun add --no-save --force "${{ matrix.foreign_opentui }}@${version}"

      - name: Build binary + bundle worker
        env:
          LL_RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: bun run build:bin ${{ matrix.target }}

      - name: Tarball
        working-directory: dist
        run: tar -czf label-lens-${{ matrix.target }}.tar.gz label-lens-${{ matrix.target }}

      - name: Per-target SHA256
        # Capture this matrix run's checksum so the aggregate job below can
        # stitch all three into a single SHA256SUMS.txt that install.sh reads
        # to verify integrity. macOS ships `shasum`, Linux ships `sha256sum`;
        # both emit `<hash>  <filename>` which the aggregator concatenates.
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum label-lens-${{ matrix.target }}.tar.gz > label-lens-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 label-lens-${{ matrix.target }}.tar.gz > label-lens-${{ matrix.target }}.tar.gz.sha256
          fi
          cat label-lens-${{ matrix.target }}.tar.gz.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/label-lens-${{ matrix.target }}.tar.gz

      - name: Stage for npm job
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/label-lens-${{ matrix.target }}/
          retention-days: 1

      - name: Stage checksum for aggregate job
        uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.target }}
          path: dist/label-lens-${{ matrix.target }}.tar.gz.sha256
          retention-days: 1

  publish-checksums:
    name: Publish SHA256SUMS.txt
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pull per-target checksums
        uses: actions/download-artifact@v4
        with:
          path: sha
          pattern: sha256-*

      - name: Concatenate into SHA256SUMS.txt
        # `find` keeps the order deterministic across matrix interleaving;
        # `awk` strips any extra path prefix the per-target steps added so
        # entries look like `<hash>  label-lens-<target>.tar.gz`.
        run: |
          set -eu
          out="SHA256SUMS.txt"
          : > "$out"
          for f in $(find sha -name "*.sha256" | sort); do
            awk '{print $1 "  " $NF}' "$f" | awk '{
              n = split($2, parts, "/");
              print $1 "  " parts[n];
            }' >> "$out"
          done
          cat "$out"

      - name: Upload SHA256SUMS.txt to release
        uses: softprops/action-gh-release@v3
        with:
          files: SHA256SUMS.txt

  publish-npm:
    name: Publish npm packages
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v5
        with:
          # 24+ required for npm OIDC trusted publishing handshake (npm/cli#9088).
          # Node 22's bundled npm rejects with misleading 404 'not in registry'.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Pull build artifacts from matrix
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: build-*

      - name: Reorganize artifacts to dist/label-lens-<target>/
        run: |
          for dir in dist/build-*; do
            target="${dir#dist/build-}"
            mv "$dir" "dist/label-lens-${target}"
          done
          ls -la dist/

      - name: Stage npm packages
        run: bun run scripts/build-npm.ts --version ${{ github.event.release.tag_name }}

      # npm OIDC trusted publishing: id-token: write (above) + npm publish
      # --provenance is enough — no NPM_TOKEN. Each package must have a
      # Trusted Publisher configured on npmjs.com pointing at this repo +
      # this workflow. Initial 0.0.0 reservation lives in dist/reserve/
      # (scripts/reserve-names.ts) and is published manually once.
      - name: Publish platform packages
        run: |
          for pkg in dist/npm/label-lens-*; do
            (cd "$pkg" && npm publish --provenance --access public)
          done

      - name: Publish top-level package
        working-directory: dist/npm/label-lens
        run: npm publish --provenance --access public
